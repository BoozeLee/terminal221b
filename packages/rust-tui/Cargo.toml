[package]
name = "terminal221b-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An original local-first Rust TUI for Terminal221b"
license = "AGPL-3.0-only"
repository = "https://github.com/BoozeLee/terminal221b"
readme = "README.md"
# A bin-only crate: there is no lib target, so there is no rustdoc to host and no
# public API to document. The value below is the crate page, which is where
# crates.io sends a reader who wants generated docs.
documentation = "https://docs.rs/terminal221b-tui"
keywords = ["tui", "cli", "assistant", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
# The CLI npm package is the primary distribution surface. This is recorded so a
# reader landing on the crate page knows which artefact to install.
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    # The crate's own copy of the provider boundary. It MUST be in `include`:
    # boundary.rs embeds it with include_str!, and a file that is not packaged
    # is a compile error in the packed crate — which is exactly how this crate
    # was found to be unpublishable. The canonical copy lives in packages/cli
    # and scripts/assert-boundary-copies-identical.sh fails the build if the two
    # ever differ.
    "resources/provider-boundary.json",
]

[[bin]]
name = "terminal221b-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
