# cargo-deny configuration.
#
# Why this file exists: the crate is AGPL-3.0-only and published to a public
# repository, so "which licences did we pull in" and "did we pull in a crate with
# a known advisory" are both answerable questions about redistribution, not just
# about hygiene. Phase 1 of the roadmap requires this file before the
# `supply-chain` job can be anything other than theatre.
#
# Scoped to advisories / bans / licenses / sources. Anything not listed here is
# cargo-deny's default, and a default is not a decision.

[graph]
# Only the workspace's own crates and what they actually depend on. Build
# dependencies and dev dependencies are included because a dev-dependency
# advisory is still a supply-chain path into a contributor's machine.
all-features = false
no-default-features = false

[advisories]
version = 2
# Do not merely count advisories — refuse the build on an unhandled one. A
# warning that scrolls past in CI output is how "we scan for vulns" becomes a
# claim that is true of no one in particular.
ignore = []
# The unmaintained-crate advisory fires on a large fraction of the transitive
# tree for any TUI project. It is deliberately NOT ignored here: ignoring it is
# a judgement that belongs in a commit with its own rationale, and a blanket
# ignore is the shape that unmaintained code accumulates behind.
unmaintained = "workspace"

[bans]
# Multiple versions of the same crate are normal in a tree this size and are not
# by themselves a finding. Duplicate detection stays on; `wildcards` is not
# denied, because denying wildcards in a Cargo.lock-driven check produces noise
# about dependencies we do not control.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

[licenses]
# Every allowed licence, and why it is compatible with AGPL-3.0-only:
#   MIT, Apache-2.0, ISC, Zlib, BSL-1.0  permissive, GPL-compatible
#   BSD-2-Clause, BSD-3-Clause           permissive, GPL-compatible
#   (MIT OR Apache-2.0)                  the dual form is the same grant twice
#   Unicode-3.0                          serde's unicode-ident dependency
#   Unicode-DFS-2016                     ditto, the pre-rename licence
#   MPL-2.0                              file-level copyleft, GPL-compatible
#   OpenSSL                               Apache-2.0 compatible
#   MPL-2.0 WITH LLVM-exception          weak copyleft, exception keeps it so
# Unlisted licences are DENIED, not warned. "allowed" here means the whole
# expression matched, so `(MIT OR Apache-2.0)` is covered by listing both.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OpenSSL",
]
# The repository's own licence. It is not a dependency, so this never matches a
# third-party crate, but stating it keeps the file self-describing.
confidence-threshold = 0.93
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io and nothing else. A dependency fetched from an arbitrary git URL is a
# dependency nobody reviewed, and this is an AGPL repository where the provenance
# of every line of redistributed code is the point.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
