name: CI

# Every action is pinned to a commit SHA, with the human-readable tag in a
# trailing comment. A tag is a mutable pointer: `actions/checkout@v4` is whatever
# the owner published today, so a tag pin is a pin in name only. Renovate/Dependabot
# are what move these forward, and a bump is then a reviewable diff like any other.
#
# Resolved with `gh api repos/<owner>/<repo>/commits/<ref>`, peeling annotated tags
# to the commit they point at.

on:
  push:
  pull_request:

permissions:
  contents: read

# One gate per job, so a red check names the thing that broke instead of a single
# `quality` that failed somewhere in its ninth step. The split is the roadmap's:
# quality / typecheck-tests / rust / supply-chain / secrets / codeql.

jobs:
  quality:
    name: TypeScript quality + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # bubblewrap is not on the ubuntu-24.04 image. Without it the six
      # `it.skipIf(!HAS_BWRAP)` cases in executor.test.ts skip silently and the
      # suite reports success at 379 instead of 385. Installing it is what makes
      # the count assertion below meaningful rather than environment-dependent.
      - name: Install bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          bwrap --version || { echo "::error::bubblewrap install did not take"; exit 1; }

      - run: npm ci

      - name: lint
        run: |
          set -euo pipefail
          npm run lint || { echo "::error::npm run lint failed"; exit 1; }

      - name: lint:shell
        run: |
          set -euo pipefail
          npm run lint:shell || { echo "::error::shellcheck failed"; exit 1; }

      - name: typecheck
        run: |
          set -euo pipefail
          npm run typecheck || { echo "::error::npm run typecheck failed"; exit 1; }

      - name: build:cli
        run: |
          set -euo pipefail
          npm run build:cli || { echo "::error::npm run build:cli failed"; exit 1; }

      - name: build (expo export)
        run: |
          set -euo pipefail
          npm run build || { echo "::error::expo export failed"; exit 1; }

      - name: test
        run: |
          set -euo pipefail
          npm test || { echo "::error::vitest failed"; exit 1; }

      # A suite that skips six cases and still exits 0 has not tested anything
      # about those six. This is the floor that says so out loud. The threshold
      # lives here and not in vitest.config.ts on purpose: a config file that
      # judges the tests is edited by the same change it would judge.
      - name: assert executed test count
        run: |
          set -euo pipefail
          ./scripts/assert-test-count.sh 390 || { echo "::error::test count floor not met"; exit 1; }

      # A SECOND runner, deliberately. vitest has no React Native preset, so
      # ChatScreen — 459 lines, the only screen, the surface a user actually
      # touches — had no render coverage at all until the SDK 57 upgrade brought
      # jest-expo. It lives in *.jest.tsx, which vitest's globs cannot match, so
      # the two suites never double-count each other and the 390 above stays a
      # statement about vitest alone.
      #
      # Deliberately inside the same job, not a new one: a separate job would add
      # a second 4-minute Node/bubblewrap setup to prove four assertions. If this
      # ever grows large enough to justify its own runner, that is the moment.
      - name: test:components (jest + jest-expo)
        run: |
          set -euo pipefail
          npm run test:components || { echo "::error::component suite failed"; exit 1; }

      # The floor, not the exit code. Four component tests deleted is a green jest
      # run and a hole in the only render coverage this app has. One floor, not
      # two: nothing in this suite is capability-dependent, and the script fails
      # on ANY skip so a future capability-gated test cannot quietly reintroduce
      # the two-runner problem the two-floor vitest script exists to handle.
      - name: assert executed component test count
        run: |
          set -euo pipefail
          ./scripts/assert-component-test-count.sh 4 || { echo "::error::component test count floor not met"; exit 1; }

  typecheck-tests:
    name: Typecheck the CLI test suite
    runs-on: ubuntu-24.04
    # BLOCKING, and the continue-on-error that stood here is gone.
    #
    # It stood because packages/cli/tsconfig.test.json (roadmap item 0.3) surfaced
    # 6 type errors no gate had ever seen — packages/cli/tsconfig.json has
    # include ["src/**/*.ts"] and rootDir src, so the tests are transformed by
    # vitest and never seen by tsc. Four were AttestedRecord call sites, one was a
    # wrong module import that had made a test vacuous, one was a Map tuple
    # inference. The fork behind the four (was AttestedRecord's narrowing
    # deliberate, on the signature/digest path?) was escalated to a human and is
    # now DECIDED: deliberate. So the tests were wrong and the types were right.
    #
    # be2934f fixed the tests without touching packages/cli/src. This commit only
    # makes the gate count. Doctrine: a gate everyone has learned to ignore is
    # worse than no gate, and this one was red-but-passing for the whole life of
    # the programme.
    #
    # Proven red: referencing a field that does not exist on ApprovalRecord gives
    #   store.test.ts(272,34): error TS2339: Property
    #   'noSuchFieldOnApprovalRecord' does not exist on type 'ApprovalRecord'.
    #   exit 2
    # The first attempt at that proof was `x as unknown as number`, which is a
    # LEGAL double cast and therefore not a type error at all. It exited 0. A red
    # proof that does not go red is worse than none, so it is recorded here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck:tests
        run: |
          set -euo pipefail
          npm run typecheck:tests || { echo "::error::typecheck:tests failed — a test file has a type error"; exit 1; }

  rust:
    name: Rust fmt / clippy / test / build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `clippy` is the gate this repository's own documentation prescribes three
      # times over (docs/TERMINAL221B-AGENTIC-ENGINEERING.md,
      # docs/TERMINAL221B-ENGINEERING-GUIDE.md,
      # .github/skills/terminal221b-tui-engineering/SKILL.md) and which no workflow
      # ran. `rustfmt` and `clippy` components both, because clippy here runs with
      # `--all-targets` and needs the test targets to lint too.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: cargo fmt
        run: |
          set -euo pipefail
          cargo fmt --all -- --check || { echo "::error::rustfmt would reformat the tree"; exit 1; }

      - name: cargo clippy
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings \
            || { echo "::error::clippy denied a warning; -D warnings is the gate"; exit 1; }

      - name: cargo test
        run: |
          set -euo pipefail
          cargo test --workspace --locked || { echo "::error::cargo test failed"; exit 1; }

      - name: cargo build
        run: |
          set -euo pipefail
          cargo build --workspace --locked || { echo "::error::cargo build failed"; exit 1; }

  supply-chain:
    name: cargo-deny (advisories / bans / licenses / sources)
    runs-on: ubuntu-24.04
    # licenses is not hygiene here, it is redistribution. The crate is
    # AGPL-3.0-only and published publicly; a dependency under a conflicting
    # licence is a defect in what we ship, not a style note.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: install cargo-deny
        run: |
          set -euo pipefail
          cargo install cargo-deny --locked \
            || { echo "::error::cargo-deny install failed"; exit 1; }
      - name: cargo deny check
        run: |
          set -euo pipefail
          cargo deny check all || { echo "::error::cargo deny reported a finding"; exit 1; }

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    # CORRECTED after the first CI run. This comment previously claimed the gate
    # "scans the working tree, not the history" and that `detect --no-git` was the
    # mode in use. That was wrong about this job: gitleaks/gitleaks-action scans
    # the git history, not `--no-git`. The distinction is not academic — the
    # working tree is clean and a full local history scan finds 36 findings across
    # 4 commits, so the two modes disagree completely on this repository.
    #
    # Left as a hard gate on purpose. An allowlist entry is a decision to say "this
    # specific value is not a secret", and each one has to be made deliberately
    # against a named file and rule rather than by muting the job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, because this job exists to scan history. fetch-depth 1
          # would silently reduce the gate to the newest commit.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_NOTIFY_USER_LIST: ""

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:${{ matrix.language }}"
