name: Stale Issues
on:
  schedule:
    - cron: '0 0 * * *'
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA with the tag in a trailing comment, like every
      # other action in this repository. This was the one file that did not
      # follow that rule: `actions/stale@v9` is a pin in name only, and the tag
      # can be moved by the action's owner to run different code with
      # `issues: write` on this repository.
      #
      # v9 is a lightweight tag, so the tag's SHA is already the commit SHA and
      # needs no peeling — which is why the value below equals
      # `gh api repos/actions/stale/commits/v9 --jq .sha`.
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          stale-issue-message: 'Marked stale due to inactivity. Closes in 7 days.'
          days-before-stale: 30
          days-before-close: 7
