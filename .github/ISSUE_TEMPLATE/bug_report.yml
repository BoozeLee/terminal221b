name: Bug Report
description: Report a bug in Terminal221b
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which component is affected?
      options:
        - CLI
        - TUI (Rust)
        - Mobile/Web (Expo)
        - Multiple
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - OS:
        - Node version:
        - Rust version (if TUI):
    validations:
      required: false